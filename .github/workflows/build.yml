name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.shell }} / JDK ${{ matrix.jdk }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: cmd, jdk: '17', ast-grep: pip }
          - { os: windows-latest, shell: bash, jdk: '17', ast-grep: npm }
          - { os: windows-latest, shell: bash, jdk: '21' }
          - { os: ubuntu-latest, shell: bash, jdk: '17' }
          - { os: macos-latest, shell: bash, jdk: '17' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      # Installs ast-grep with one method per job, so the ast-grep availability test covers both install layouts.
      - uses: actions/setup-python@v5
        if: matrix.ast-grep == 'pip'
        with:
          python-version: '3.12'
      - name: Install ast-grep (${{ matrix.ast-grep }})
        if: matrix.ast-grep
        shell: bash
        run: |
          if [ "${{ matrix.ast-grep }}" = npm ]; then
            npm install --global @ast-grep/cli
          else
            pip install ast-grep-cli
          fi
          where ast-grep
          echo "SMC_UPGRADER_TEST_AST_GREP=${{ matrix.ast-grep }}" >> "$GITHUB_ENV"

      - name: Build (cmd)
        if: matrix.shell == 'cmd'
        shell: cmd
        run: smc-upgraderw.cmd -B clean install

      # Runs the build with a watchdog: if it is still running after 10 minutes, dump
      # the threads of every JVM (to find a stalled test), then kill the build.
      - name: Build (bash)
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          ./smc-upgraderw -B clean install &
          build_pid=$!
          for _ in $(seq 1 120); do
            kill -0 "$build_pid" 2>/dev/null || break
            sleep 5
          done
          if kill -0 "$build_pid" 2>/dev/null; then
            echo "::error::Build stalled; dumping JVM threads"
            for pid in $(jps -q); do
              echo "===== jstack $pid ($(jps -l | grep "^$pid " | cut -d' ' -f2-)) ====="
              jstack "$pid" || true
            done
            kill "$build_pid"
            exit 1
          fi
          wait "$build_pid"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-${{ matrix.shell }}-${{ matrix.jdk }}
          path: target/surefire-reports
