# Temporary workflow for PB-14428. Remove before merging.
name: Cross-platform build

on:
  push:
    branches: [PB-14428]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.shell }} / JDK ${{ matrix.jdk }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: cmd, jdk: '17' }
          - { os: windows-latest, shell: bash, jdk: '17' }
          - { os: windows-latest, shell: bash, jdk: '21' }
          - { os: ubuntu-latest, shell: bash, jdk: '17' }
          - { os: macos-latest, shell: bash, jdk: '17' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Build (cmd)
        if: matrix.shell == 'cmd'
        shell: cmd
        run: smc-upgraderw.cmd -B clean install

      # Runs the build with a watchdog: if it is still running after 10 minutes, dump
      # the threads of every JVM (to find a stalled test), then kill the build.
      - name: Build (bash)
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          ./smc-upgraderw -B clean install &
          build_pid=$!
          for _ in $(seq 1 120); do
            kill -0 "$build_pid" 2>/dev/null || break
            sleep 5
          done
          if kill -0 "$build_pid" 2>/dev/null; then
            echo "::error::Build stalled; dumping JVM threads"
            for pid in $(jps -q); do
              echo "===== jstack $pid ($(jps -l | grep "^$pid " | cut -d' ' -f2-)) ====="
              jstack "$pid" || true
            done
            kill "$build_pid"
            exit 1
          fi
          wait "$build_pid"

      - name: Shell timing probe
        if: always() && runner.os == 'Windows' && matrix.shell == 'bash'
        shell: bash
        run: |
          jar=$(ls target/*-jar-with-dependencies.jar)
          probe="java -cp $jar .github/probe/ShellTiming.java"
          echo "=== stdin from /dev/null ==="; timeout 300 $probe < /dev/null
          echo "=== stdin from open pipe ==="; (sleep 400) | timeout 300 $probe

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-${{ matrix.shell }}-${{ matrix.jdk }}
          path: target/surefire-reports
